name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          # arm64 worker build is temporarily disabled.
          # - goos: linux
          #   goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up QEMU
        if: matrix.goarch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential file autoconf automake libtool pkg-config cmake

      - name: Build workers
        env:
          NERDBENCH_TARGET: linux-${{ matrix.goarch }}
        run: |
          if [ "${{ matrix.goarch }}" = "arm64" ]; then
            docker run --rm --platform linux/arm64 \
              -v "$PWD:/work" -w /work \
              -e NERDBENCH_TARGET=linux-arm64 \
              golang:1.22-bookworm \
              sh -c 'apt-get update && apt-get install -y build-essential file autoconf automake libtool pkg-config cmake git && scripts/build-workers.sh'
          else
            scripts/build-workers.sh
          fi

      - name: Build Go binary
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          grep -q 'OS:         "${{ matrix.goos }}"' internal/assets/generated_workers.go
          grep -q 'Arch:       "${{ matrix.goarch }}"' internal/assets/generated_workers.go
          mkdir -p dist
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags "-X main.version=${VERSION}" -o dist/nerdbench-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/nerdbench

      - name: Verify binary runs
        run: |
          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            ./dist/nerdbench-${{ matrix.goos }}-${{ matrix.goarch }} --version
            test "$(./dist/nerdbench-${{ matrix.goos }}-${{ matrix.goarch }} --version)" = "${{ github.ref_name }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nerdbench-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/nerdbench-${{ matrix.goos }}-${{ matrix.goarch }}

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: nerdbench-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum nerdbench-* > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/SHA256SUMS

  release:
    needs: checksums
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/nerdbench-*
            dist/SHA256SUMS
          generate_release_notes: true
